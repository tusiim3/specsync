# Runs when a release is published on GitHub (Releases → Draft a new release,
# tag like v1.2.3 targeting master). It checks the tag matches package.json,
# runs the checks, publishes @tusiim3/specsync to npm (trusted publishing, or
# the NPM_TOKEN secret until that is set up) and moves the major tag (v1) so
# `uses: tusiim3/specsync@v1` picks up the new release.
name: release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v5
        with:
          # Node 24 ships npm 11, which trusted publishing needs (11.5.1+).
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run build
      # Trusted publishing (OIDC) is used when it is set up for the package on
      # npmjs.com; until then the NPM_TOKEN secret is used. Provenance and
      # public access come from publishConfig in package.json.
      - name: Publish to npm
        if: ${{ !github.event.release.prerelease }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Move the major tag
        if: ${{ !github.event.release.prerelease }}
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG^{commit}"
          git push -f origin "refs/tags/$major"
          echo "Moved $major to $TAG"
