# Runs when a release is published on GitHub (Releases → Draft a new release,
# tag like v1.2.3 targeting master). It checks the tag matches package.json,
# runs the checks, publishes to npm (when the NPM_TOKEN secret exists) and moves
# the major tag (v1) so `uses: tusiim3/specsync@v1` picks up the new release.
name: release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - name: Check for an npm token
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "present=$([ -n "$NPM_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        if: steps.token.outputs.present == 'true' && !github.event.release.prerelease
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Skipped npm
        if: steps.token.outputs.present != 'true'
        run: echo "::notice::Add an NPM_TOKEN repository secret to publish to npm."
      - name: Move the major tag
        if: ${{ !github.event.release.prerelease }}
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG^{commit}"
          git push -f origin "refs/tags/$major"
          echo "Moved $major to $TAG"
